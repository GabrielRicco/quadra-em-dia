# Roda os testes das regras de negócio (npm test) a cada push e pull request.
# O resultado aparece na aba Actions do GitHub e no selo do README.
name: Testes

on:
  push:
  pull_request:

# Só leitura: o workflow não precisa (e não pode) escrever no repositório
permissions:
  contents: read

jobs:
  testes:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo # mesmo fuso de quem usa o app
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rodar os testes
        run: npm test
